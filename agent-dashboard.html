<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Customisation Dashboard - Zoho CRM</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --card: 0 0% 100%;
            --card-foreground: 222.2 84% 4.9%;
            --popover: 0 0% 100%;
            --popover-foreground: 222.2 84% 4.9%;
            --primary: 264 83% 57%;
            --primary-foreground: 210 40% 98%;
            --primary-glow: 264 83% 67%;
            --secondary: 210 40% 96.1%;
            --secondary-foreground: 222.2 47.4% 11.2%;
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --accent: 216 32% 17%;
            --accent-foreground: 210 40% 98%;
            --professional: 213 27% 84%;
            --professional-foreground: 213 27% 24%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%;
            --radius: 0.5rem;
            --gradient-primary: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
            --gradient-subtle: linear-gradient(180deg, hsl(var(--background)), hsl(var(--professional)));
            --shadow-elegant: 0 10px 30px -10px hsl(var(--primary) / 0.1);
            --shadow-glow: 0 0 40px hsl(var(--primary-glow) / 0.15);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark {
            --background: 222.2 84% 4.9%;
            --foreground: 210 40% 98%;
            --card: 222.2 84% 4.9%;
            --card-foreground: 210 40% 98%;
            --popover: 222.2 84% 4.9%;
            --popover-foreground: 210 40% 98%;
            --primary: 210 40% 98%;
            --primary-foreground: 222.2 47.4% 11.2%;
            --secondary: 217.2 32.6% 17.5%;
            --secondary-foreground: 210 40% 98%;
            --muted: 217.2 32.6% 17.5%;
            --muted-foreground: 215 20.2% 65.1%;
            --accent: 217.2 32.6% 17.5%;
            --accent-foreground: 210 40% 98%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 210 40% 98%;
            --border: 217.2 32.6% 17.5%;
            --input: 217.2 32.6% 17.5%;
            --ring: 212.7 26.8% 83.9%;
        }

        * {
            border-color: hsl(var(--border));
        }

        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
        }

        .bg-primary { background-color: hsl(var(--primary)); }
        .text-primary { color: hsl(var(--primary)); }
        .bg-secondary { background-color: hsl(var(--secondary)); }
        .text-secondary { color: hsl(var(--secondary)); }
        .bg-card { background-color: hsl(var(--card)); }
        .text-card-foreground { color: hsl(var(--card-foreground)); }
        .bg-muted { background-color: hsl(var(--muted)); }
        .text-muted-foreground { color: hsl(var(--muted-foreground)); }
        .bg-professional { background-color: hsl(var(--professional)); }
        .text-professional-foreground { color: hsl(var(--professional-foreground)); }
        
        .shadow-elegant { box-shadow: var(--shadow-elegant); }
        .transition-smooth { transition: var(--transition-smooth); }
        
        .bg-gradient-to-br { background-image: linear-gradient(to bottom right, var(--tw-gradient-stops)); }
        .from-background { --tw-gradient-from: hsl(var(--background)); --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, transparent); }
        .to-professional\/20 { --tw-gradient-to: hsl(var(--professional) / 0.2); }
        
        .border-primary\/20 { border-color: hsl(var(--primary) / 0.2); }
        .bg-primary\/10 { background-color: hsl(var(--primary) / 0.1); }
        .bg-card\/80 { background-color: hsl(var(--card) / 0.8); }
        
        .hover\:bg-primary\/90:hover { background-color: hsl(var(--primary) / 0.9); }
        .hover\:bg-muted\/50:hover { background-color: hsl(var(--muted) / 0.5); }
        
        .backdrop-blur-sm { backdrop-filter: blur(4px); }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: hsl(var(--muted)); }
        ::-webkit-scrollbar-thumb { background: hsl(var(--primary)); border-radius: 3px; }
        
        /* Modal overlay */
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); }
        
        .btn-primary {
            background-color: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
            border: 1px solid hsl(var(--primary));
        }
        .btn-primary:hover {
            background-color: hsl(var(--primary) / 0.9);
        }
        
        .btn-outline {
            background-color: transparent;
            color: hsl(var(--foreground));
            border: 1px solid hsl(var(--border));
        }
        .btn-outline:hover {
            background-color: hsl(var(--muted));
        }
        
        .btn-ghost {
            background-color: transparent;
            color: hsl(var(--foreground));
            border: none;
        }
        .btn-ghost:hover {
            background-color: hsl(var(--muted));
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'hsl(var(--primary))',
                        'primary-foreground': 'hsl(var(--primary-foreground))',
                        secondary: 'hsl(var(--secondary))',
                        'secondary-foreground': 'hsl(var(--secondary-foreground))',
                        muted: 'hsl(var(--muted))',
                        'muted-foreground': 'hsl(var(--muted-foreground))',
                        card: 'hsl(var(--card))',
                        'card-foreground': 'hsl(var(--card-foreground))',
                        border: 'hsl(var(--border))',
                        background: 'hsl(var(--background))',
                        foreground: 'hsl(var(--foreground))',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            Settings, 
            BarChart3, 
            ChevronDown, 
            ChevronUp, 
            Bot, 
            Eye, 
            Calendar, 
            Activity, 
            Users, 
            DollarSign, 
            Mail, 
            Phone, 
            Zap, 
            Plus, 
            Rocket, 
            Search, 
            MessageSquare, 
            FileText, 
            ArrowLeft, 
            TrendingUp, 
            Target, 
            Clock, 
            CheckCircle, 
            Edit3, 
            Save,
            X
        } = lucide;

        // UI Components
        const Button = ({ children, variant = 'default', size = 'default', className = '', onClick, ...props }) => {
            const baseClasses = 'inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:opacity-50 disabled:pointer-events-none ring-offset-background';
            
            const variants = {
                default: 'btn-primary',
                outline: 'btn-outline',
                ghost: 'btn-ghost',
                secondary: 'bg-secondary text-secondary-foreground hover:bg-secondary/80'
            };
            
            const sizes = {
                default: 'h-10 py-2 px-4',
                sm: 'h-9 px-3 rounded-md',
                lg: 'h-11 px-8 rounded-md'
            };
            
            return (
                <button 
                    className={`${baseClasses} ${variants[variant]} ${sizes[size]} ${className}`}
                    onClick={onClick}
                    {...props}
                >
                    {children}
                </button>
            );
        };

        const Card = ({ children, className = '', ...props }) => (
            <div className={`rounded-lg border bg-card text-card-foreground ${className}`} {...props}>
                {children}
            </div>
        );

        const CardHeader = ({ children, className = '', ...props }) => (
            <div className={`flex flex-col space-y-1.5 p-6 ${className}`} {...props}>
                {children}
            </div>
        );

        const CardTitle = ({ children, className = '', ...props }) => (
            <h3 className={`text-2xl font-semibold leading-none tracking-tight ${className}`} {...props}>
                {children}
            </h3>
        );

        const CardContent = ({ children, className = '', ...props }) => (
            <div className={`p-6 pt-0 ${className}`} {...props}>
                {children}
            </div>
        );

        const Badge = ({ children, variant = 'default', className = '', ...props }) => {
            const variants = {
                default: 'bg-primary text-primary-foreground',
                secondary: 'bg-secondary text-secondary-foreground',
                outline: 'text-foreground border border-input'
            };
            
            return (
                <span className={`inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors ${variants[variant]} ${className}`} {...props}>
                    {children}
                </span>
            );
        };

        const Avatar = ({ children, className = '', ...props }) => (
            <div className={`relative flex h-10 w-10 shrink-0 overflow-hidden rounded-full ${className}`} {...props}>
                {children}
            </div>
        );

        const AvatarFallback = ({ children, className = '', ...props }) => (
            <div className={`flex h-full w-full items-center justify-center rounded-full bg-muted ${className}`} {...props}>
                {children}
            </div>
        );

        const Input = ({ className = '', ...props }) => (
            <input className={`flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 ${className}`} {...props} />
        );

        const Textarea = ({ className = '', ...props }) => (
            <textarea className={`flex min-h-[80px] w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 ${className}`} {...props} />
        );

        const Label = ({ children, className = '', htmlFor, ...props }) => (
            <label className={`text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 ${className}`} htmlFor={htmlFor} {...props}>
                {children}
            </label>
        );

        const Checkbox = ({ checked, onCheckedChange, className = '', ...props }) => (
            <input 
                type="checkbox" 
                checked={checked}
                onChange={(e) => onCheckedChange && onCheckedChange(e.target.checked)}
                className={`h-4 w-4 rounded border border-primary text-primary focus:ring-2 focus:ring-primary ${className}`}
                {...props}
            />
        );

        const Select = ({ children, value, onValueChange, ...props }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [selectedValue, setSelectedValue] = useState(value);

            const handleSelect = (newValue) => {
                setSelectedValue(newValue);
                onValueChange && onValueChange(newValue);
                setIsOpen(false);
            };

            return (
                <div className="relative" {...props}>
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="flex h-10 w-full items-center justify-between rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                    >
                        <span>{selectedValue || 'Select...'}</span>
                        <ChevronDown className="h-4 w-4 opacity-50" />
                    </button>
                    {isOpen && (
                        <div className="absolute top-full left-0 right-0 z-50 mt-1 rounded-md border bg-popover p-1 shadow-md">
                            {React.Children.map(children, child =>
                                React.cloneElement(child, { onSelect: handleSelect })
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const SelectItem = ({ children, value, onSelect }) => (
            <div
                onClick={() => onSelect(value)}
                className="relative flex cursor-default select-none items-center rounded-sm px-2 py-1.5 text-sm outline-none hover:bg-accent hover:text-accent-foreground cursor-pointer"
            >
                {children}
            </div>
        );

        const Modal = ({ isOpen, onClose, children }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center">
                    <div className="modal-overlay fixed inset-0" onClick={onClose}></div>
                    <div className="relative z-50 w-full max-w-4xl max-h-[90vh] overflow-y-auto bg-background rounded-lg shadow-lg">
                        {children}
                    </div>
                </div>
            );
        };

        // Agent Info Component
        const AgentInfo = ({ onDetailView }) => {
            const agentData = {
                name: "Sales Assistant Agent",
                description: "Specialized AI agent for lead qualification and customer engagement within Zoho CRM. Handles initial customer inquiries, qualifies leads, and schedules follow-up activities.",
                model: "GPT-4o Mini",
                role: "Lead Qualification Specialist",
                status: "Active",
                created: "2024-01-15",
                lastUpdated: "2024-01-28"
            };

            return (
                <div className="space-y-6">
                    <div className="flex items-start gap-6">
                        <div className="flex items-start gap-4">
                            <Avatar className="h-16 w-16 border-2 border-primary/20">
                                <AvatarFallback className="bg-primary/10 text-primary text-lg font-semibold">
                                    <Bot className="h-8 w-8" />
                                </AvatarFallback>
                            </Avatar>
                            
                            <div className="space-y-3 flex-1">
                                <div>
                                    <div className="flex items-center gap-2 mb-2">
                                        <h3 className="text-xl font-semibold text-foreground">{agentData.name}</h3>
                                        <Badge variant="secondary" className="bg-green-100 text-green-700 border-green-200">
                                            <Activity className="h-3 w-3 mr-1" />
                                            {agentData.status}
                                        </Badge>
                                    </div>
                                    <p className="text-muted-foreground leading-relaxed max-w-2xl">
                                        {agentData.description}
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4">
                                    <div className="flex items-center gap-2 text-sm">
                                        <div className="p-1.5 bg-blue-100 text-blue-600 rounded">
                                            <Bot className="h-3 w-3" />
                                        </div>
                                        <div>
                                            <span className="text-muted-foreground">Model:</span>
                                            <span className="font-medium ml-1">{agentData.model}</span>
                                        </div>
                                    </div>
                                    
                                    <div className="flex items-center gap-2 text-sm">
                                        <div className="p-1.5 bg-purple-100 text-purple-600 rounded">
                                            <Activity className="h-3 w-3" />
                                        </div>
                                        <div>
                                            <span className="text-muted-foreground">Role:</span>
                                            <span className="font-medium ml-1">{agentData.role}</span>
                                        </div>
                                    </div>
                                    
                                    <div className="flex items-center gap-2 text-sm">
                                        <div className="p-1.5 bg-green-100 text-green-600 rounded">
                                            <Calendar className="h-3 w-3" />
                                        </div>
                                        <div>
                                            <span className="text-muted-foreground">Updated:</span>
                                            <span className="font-medium ml-1">{agentData.lastUpdated}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <Button variant="outline" onClick={onDetailView} className="gap-2 shrink-0">
                            <Eye className="h-4 w-4" />
                            Detail View
                        </Button>
                    </div>
                </div>
            );
        };

        // Agent Signals Component
        const AgentSignals = () => {
            const [customSignal, setCustomSignal] = useState('');
            const [selectedSignals, setSelectedSignals] = useState([]);

            const modules = [
                {
                    name: 'Leads',
                    icon: Users,
                    color: 'bg-blue-100 text-blue-600',
                    signals: [
                        { id: 'lead_created', name: 'Lead Created', description: 'Trigger when a new lead is added' },
                        { id: 'lead_edited', name: 'Lead Edited', description: 'Trigger when lead information is updated' },
                        { id: 'lead_qualified', name: 'Lead Qualified', description: 'Trigger when lead status changes to qualified' },
                        { id: 'lead_converted', name: 'Lead Converted', description: 'Trigger when lead is converted to deal' }
                    ]
                },
                {
                    name: 'Contacts',
                    icon: Users,
                    color: 'bg-green-100 text-green-600',
                    signals: [
                        { id: 'contact_created', name: 'Contact Created', description: 'Trigger when a new contact is added' },
                        { id: 'contact_updated', name: 'Contact Updated', description: 'Trigger when contact details are modified' },
                        { id: 'contact_engagement', name: 'Contact Engagement', description: 'Trigger on contact interaction' }
                    ]
                },
                {
                    name: 'Deals',
                    icon: DollarSign,
                    color: 'bg-purple-100 text-purple-600',
                    signals: [
                        { id: 'deal_created', name: 'Deal Created', description: 'Trigger when a new deal is created' },
                        { id: 'deal_stage_change', name: 'Deal Stage Change', description: 'Trigger when deal moves to next stage' },
                        { id: 'deal_won', name: 'Deal Won', description: 'Trigger when deal is closed won' },
                        { id: 'deal_lost', name: 'Deal Lost', description: 'Trigger when deal is closed lost' }
                    ]
                },
                {
                    name: 'Activities',
                    icon: Calendar,
                    color: 'bg-orange-100 text-orange-600',
                    signals: [
                        { id: 'task_created', name: 'Task Created', description: 'Trigger when a new task is created' },
                        { id: 'event_scheduled', name: 'Event Scheduled', description: 'Trigger when an event is scheduled' },
                        { id: 'call_logged', name: 'Call Logged', description: 'Trigger when a call activity is logged' }
                    ]
                },
                {
                    name: 'Emails',
                    icon: Mail,
                    color: 'bg-red-100 text-red-600',
                    signals: [
                        { id: 'email_sent', name: 'Email Sent', description: 'Trigger when an email is sent' },
                        { id: 'email_opened', name: 'Email Opened', description: 'Trigger when email is opened by recipient' },
                        { id: 'email_clicked', name: 'Email Clicked', description: 'Trigger when email link is clicked' }
                    ]
                },
                {
                    name: 'Calls',
                    icon: Phone,
                    color: 'bg-teal-100 text-teal-600',
                    signals: [
                        { id: 'call_incoming', name: 'Incoming Call', description: 'Trigger on incoming call' },
                        { id: 'call_missed', name: 'Missed Call', description: 'Trigger when a call is missed' },
                        { id: 'call_completed', name: 'Call Completed', description: 'Trigger when call is completed' }
                    ]
                }
            ];

            const handleSignalToggle = (signalId) => {
                setSelectedSignals(prev => 
                    prev.includes(signalId) 
                        ? prev.filter(id => id !== signalId)
                        : [...prev, signalId]
                );
            };

            const addCustomSignal = () => {
                if (customSignal.trim()) {
                    setSelectedSignals(prev => [...prev, `custom_${Date.now()}`]);
                    setCustomSignal('');
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex items-center gap-2 mb-4">
                        <Zap className="h-5 w-5 text-primary" />
                        <span className="text-sm text-muted-foreground">
                            Select the CRM modules and signals that should trigger your agent
                        </span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {modules.map((module) => {
                            const Icon = module.icon;
                            return (
                                <Card key={module.name} className="border-2 border-border/50 hover:border-primary/30 transition-all">
                                    <CardHeader className="pb-3">
                                        <CardTitle className="flex items-center gap-2 text-lg">
                                            <div className={`p-2 rounded-lg ${module.color}`}>
                                                <Icon className="h-4 w-4" />
                                            </div>
                                            {module.name}
                                            <Badge variant="secondary" className="ml-auto text-xs">
                                                {module.signals.length}
                                            </Badge>
                                        </CardTitle>
                                    </CardHeader>
                                    <CardContent className="space-y-3">
                                        {module.signals.map((signal) => (
                                            <div key={signal.id} className="flex items-start space-x-2">
                                                <Checkbox
                                                    id={signal.id}
                                                    checked={selectedSignals.includes(signal.id)}
                                                    onCheckedChange={() => handleSignalToggle(signal.id)}
                                                    className="mt-0.5"
                                                />
                                                <div className="grid gap-1.5 leading-none">
                                                    <Label
                                                        htmlFor={signal.id}
                                                        className="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
                                                    >
                                                        {signal.name}
                                                    </Label>
                                                    <p className="text-xs text-muted-foreground">
                                                        {signal.description}
                                                    </p>
                                                </div>
                                            </div>
                                        ))}
                                    </CardContent>
                                </Card>
                            );
                        })}
                    </div>

                    <Card className="border-dashed border-2 border-primary/30 bg-primary/5">
                        <CardHeader>
                            <CardTitle className="flex items-center gap-2 text-lg">
                                <Plus className="h-5 w-5 text-primary" />
                                Custom Signals
                            </CardTitle>
                        </CardHeader>
                        <CardContent>
                            <div className="flex gap-2">
                                <Input
                                    placeholder="Enter custom signal name..."
                                    value={customSignal}
                                    onChange={(e) => setCustomSignal(e.target.value)}
                                    className="flex-1"
                                />
                                <Button onClick={addCustomSignal} size="sm">
                                    <Plus className="h-4 w-4 mr-1" />
                                    Add
                                </Button>
                            </div>
                            <p className="text-xs text-muted-foreground mt-2">
                                Create custom triggers based on your specific business needs
                            </p>
                        </CardContent>
                    </Card>

                    {selectedSignals.length > 0 && (
                        <Card className="bg-muted/50">
                            <CardHeader>
                                <CardTitle className="text-lg flex items-center gap-2">
                                    Selected Signals
                                    <Badge variant="secondary">{selectedSignals.length}</Badge>
                                </CardTitle>
                            </CardHeader>
                            <CardContent>
                                <div className="flex flex-wrap gap-2">
                                    {selectedSignals.slice(0, 10).map((signalId) => (
                                        <Badge key={signalId} variant="secondary" className="bg-primary/10 text-primary">
                                            {signalId.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase())}
                                        </Badge>
                                    ))}
                                    {selectedSignals.length > 10 && (
                                        <Badge variant="secondary">
                                            +{selectedSignals.length - 10} more
                                        </Badge>
                                    )}
                                </div>
                            </CardContent>
                        </Card>
                    )}
                </div>
            );
        };

        // Agent Starting Points Component
        const AgentStartingPoints = () => {
            const [startingPoint, setStartingPoint] = useState('');
            const [selectedPlacements, setSelectedPlacements] = useState([]);
            const [selectedAskziaOptions, setSelectedAskziaOptions] = useState([]);
            const [keywords, setKeywords] = useState([]);
            const [newKeyword, setNewKeyword] = useState('');

            const digitalEmployeePlacements = [
                { id: 'chat_widget', name: 'Chat Widget', description: 'Embedded chat on website/portal' },
                { id: 'email_signature', name: 'Email Signature', description: 'Auto-responses in email threads' },
                { id: 'landing_pages', name: 'Landing Pages', description: 'Lead capture forms and pages' },
                { id: 'help_desk', name: 'Help Desk', description: 'Customer support ticket system' },
                { id: 'mobile_app', name: 'Mobile App', description: 'In-app assistant functionality' }
            ];

            const askziaOptions = [
                { id: 'co_create', name: 'Co-Create', description: 'Collaborative content creation' },
                { id: 'data_enrichment', name: 'Data Enrichment', description: 'Enhance existing records' },
                { id: 'lead_scoring', name: 'Lead Scoring', description: 'Automatic lead qualification' },
                { id: 'pipeline_insights', name: 'Pipeline Insights', description: 'Sales forecast analysis' },
                { id: 'workflow_automation', name: 'Workflow Automation', description: 'Process automation triggers' }

            const handlePlacementToggle = (placementId) => {
                setSelectedPlacements(prev =>
                    prev.includes(placementId)
                        ? prev.filter(id => id !== placementId)
                        : [...prev, placementId]
                );
            };

            const handleAskziaToggle = (optionId) => {
                setSelectedAskziaOptions(prev =>
                    prev.includes(optionId)
                        ? prev.filter(id => id !== optionId)
                        : [...prev, optionId]
                );
            };

            const addKeyword = () => {
                if (newKeyword.trim() && !keywords.includes(newKeyword.trim())) {
                    setKeywords(prev => [...prev, newKeyword.trim()]);
                    setNewKeyword('');
                }
            };

            const removeKeyword = (keyword) => {
                setKeywords(prev => prev.filter(k => k !== keyword));
            };

            return (
                <div className="space-y-6">
                    <div className="flex items-center gap-2 mb-4">
                        <Rocket className="h-5 w-5 text-primary" />
                        <span className="text-sm text-muted-foreground">
                            Configure how and when your agent should be triggered
                        </span>
                    </div>

                    <Card className="border-2 border-primary/20 bg-primary/5">
                        <CardHeader>
                            <CardTitle className="flex items-center gap-2">
                                <Settings className="h-5 w-5" />
                                Agent Trigger Type
                            </CardTitle>
                        </CardHeader>
                        <CardContent>
                            <div className="space-y-2">
                                <Label htmlFor="starting-point">Select Starting Point</Label>

                    {startingPoint === 'digital_employee' && (

                                    <CardTitle className="flex items-center gap-2">
                                        <Bot className="h-5 w-5 text-blue-600" />
                                        Digital Employee Placements
                                    </CardTitle>
                                </CardHeader>
                                <CardContent>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {digitalEmployeePlacements.map((placement) => (
                                            <div key={placement.id} className="flex items-start space-x-3 p-3 border rounded-lg hover:bg-muted/50 transition-colors">
                                                <Checkbox
                                                    id={placement.id}
                                                    checked={selectedPlacements.includes(placement.id)}
                                                    onCheckedChange={() => handlePlacementToggle(placement.id)}

                                                />

                                                    <Label htmlFor={placement.id} className="text-sm font-medium leading-none">
                                                        {placement.name}
                                                    </Label>
                                                    <p className="text-xs text-muted-foreground">
                                                        {placement.description}
                                                    </p>
                                                </div>
                                            </div>

                                    </div>
                                </CardContent>
                            </Card>

                            <Card>
                                <CardHeader>
                                    <CardTitle>Conditions & Rules</CardTitle>
                                </CardHeader>

                                    <div className="space-y-4">
                                        <div>
                                            <Label htmlFor="trigger-conditions">Trigger Conditions</Label>

                                </CardContent>
                            </Card>
                        </div>

                    {startingPoint === 'askzia' && (

                            </CardHeader>

                                                onCheckedChange={() => handleAskziaToggle(option.id)}

                                                <Label htmlFor={option.id} className="text-sm font-medium leading-none">
                                                    {option.name}
                                                </Label>
                                                <p className="text-xs text-muted-foreground">
                                                    {option.description}
                                                </p>
                                            </div>
                                        </div>
                                    ))}

                            </CardContent>

                                    <div>
                                        <Label>Active Keywords</Label>
                                        <div className="flex flex-wrap gap-2 mt-2">
                                            {keywords.map((keyword) => (
                                                <Badge
                                                    key={keyword}
                                                    variant="secondary"
                                                    className="bg-green-100 text-green-700 border-green-200 cursor-pointer"
                                                    onClick={() => removeKeyword(keyword)}
                                                >
                                                    {keyword} ×
                                                </Badge>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </CardContent>
                        </Card>
                    )}

            );
        };

            const analyticsData = {
                totalInteractions: 1247,
                successfulConversions: 89,
                averageResponseTime: '2.3s',
                customerSatisfaction: 4.7,
                activeSignals: 23,

            const recentActivity = [
                { id: 1, action: 'Lead Qualified', time: '2 minutes ago', status: 'success' },
                { id: 2, action: 'Email Sent', time: '5 minutes ago', status: 'success' },
                { id: 3, action: 'Call Scheduled', time: '12 minutes ago', status: 'success' },
                { id: 4, action: 'Deal Created', time: '18 minutes ago', status: 'success' },
                { id: 5, action: 'Contact Updated', time: '25 minutes ago', status: 'success' }

            return (

                    <div className="border-b bg-card/80 backdrop-blur-sm sticky top-0 z-40">

                            <div className="flex items-center gap-4">

                                    <ArrowLeft className="h-4 w-4" />

                                    <h1 className="text-2xl font-bold text-foreground">Agent Analytics</h1>
                                    <p className="text-sm text-muted-foreground">Performance insights and metrics</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="container mx-auto px-6 py-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                            <Card className="shadow-elegant border-0 bg-card/80 backdrop-blur-sm">
                                <CardHeader className="flex flex-row items-center justify-between space-y-0 pb-2">
                                    <CardTitle className="text-sm font-medium">Total Interactions</CardTitle>
                                    <MessageSquare className="h-4 w-4 text-blue-600" />
                                </CardHeader>
                                <CardContent>
                                    <div className="text-2xl font-bold">{analyticsData.totalInteractions.toLocaleString()}</div>
                                    <div className="flex items-center gap-1 text-xs text-muted-foreground">
                                        <TrendingUp className="h-3 w-3 text-green-600" />
                                        <span className="text-green-600">+{analyticsData.weeklyGrowth}%</span>

                                </CardContent>

                                    <Target className="h-4 w-4 text-green-600" />
                                </CardHeader>
                                <CardContent>
                                    <div className="text-2xl font-bold">{analyticsData.successfulConversions}</div>
                                    <div className="flex items-center gap-1 text-xs text-muted-foreground">
                                        <span>Conversion rate:</span>
                                        <span className="text-green-600 font-medium">
                                            {((analyticsData.successfulConversions / analyticsData.totalInteractions) * 100).toFixed(1)}%

                                    </div>

                                    <CardTitle className="text-sm font-medium">Avg Response Time</CardTitle>
                                    <Clock className="h-4 w-4 text-purple-600" />
                                </CardHeader>
                                <CardContent>
                                    <div className="text-2xl font-bold">{analyticsData.averageResponseTime}</div>
                                    <div className="flex items-center gap-1 text-xs text-muted-foreground">
                                        <CheckCircle className="h-3 w-3 text-green-600" />
                                        <span className="text-green-600">Excellent</span>
                                        <span>response time</span>
                                    </div>
                                </CardContent>
                            </Card>
                        </div>

                                <CardTitle>Performance Trends</CardTitle>
                            </CardHeader>
                            <CardContent>

                                    <div className="text-center text-muted-foreground">
                                        <TrendingUp className="h-12 w-12 mx-auto mb-4 text-primary" />
                                        <p className="text-lg font-medium">Performance Chart</p>
                                        <p className="text-sm">Detailed analytics visualization would be displayed here</p>
                                    </div>
                                </div>
                            </CardContent>
                        </Card>

                        <Card className="shadow-elegant border-0 bg-card/80 backdrop-blur-sm">
                            <CardHeader>
                                <CardTitle className="flex items-center gap-2">
                                    <MessageSquare className="h-5 w-5 text-primary" />
                                    Recent Activity
                                </CardTitle>
                            </CardHeader>
                            <CardContent>
                                <div className="space-y-4">
                                    {recentActivity.map((activity) => (
                                        <div key={activity.id} className="flex items-center justify-between p-3 border rounded-lg hover:bg-muted/50 transition-colors">
                                            <div className="flex items-center gap-3">
                                                <div className="p-2 bg-green-100 text-green-600 rounded-lg">
                                                    <CheckCircle className="h-4 w-4" />
                                                </div>
                                                <div>
                                                    <p className="font-medium">{activity.action}</p>
                                                    <p className="text-sm text-muted-foreground">{activity.time}</p>
                                                </div>
                                            </div>
                                            <Badge variant="secondary" className="bg-green-100 text-green-700 border-green-200">
                                                Success
                                            </Badge>
                                        </div>
                                    ))}
                                </div>
                            </CardContent>
                        </Card>
                    </div>
                </div>
            );

        const AgentDetailModal = ({ isOpen, onClose }) => {
            const agentDetails = {
                name: "Sales Assistant Agent",
                description: `Specialized AI agent for lead qualification and customer engagement within Zoho CRM. 

This agent is designed to handle initial customer inquiries, qualify leads based on predefined criteria, and schedule appropriate follow-up activities. It integrates seamlessly with Zoho CRM modules and can access customer data to provide personalized responses.

Key capabilities include:
- Lead scoring and qualification
- Automated follow-up scheduling  
- Customer inquiry routing
- Basic customer support
- Integration with email and phone systems`,
                model: "GPT-4o Mini",
                role: "Lead Qualification Specialist",
                instructions: `You are a professional sales assistant working within Zoho CRM. Your primary responsibilities include:

1. Lead Qualification:
   - Ask qualifying questions to understand prospect needs
   - Score leads based on budget, authority, need, and timeline (BANT)
   - Update lead status and scores in CRM

2. Customer Engagement:
   - Respond to inquiries within 2 minutes during business hours
   - Provide helpful information about products/services
   - Schedule meetings with appropriate sales representatives

3. Guidelines:
   - Always maintain a professional and helpful tone
   - Ask for permission before updating customer records
   - Escalate complex issues to human agents
   - Follow data privacy and compliance requirements`,
                conditions: `Activation Conditions:
- New lead enters the system
- Customer submits contact form
- Email inquiry received during business hours
- Phone call missed or requires follow-up
- Lead score changes significantly

Business Rules:
- Only activate during business hours (9 AM - 6 PM EST)
- Require human approval for deals over $10,000
- Automatically escalate after 3 unsuccessful contact attempts`
            };

            return (
                <Modal isOpen={isOpen} onClose={onClose}>
                    <div className="p-6">
                        <div className="flex items-center justify-between mb-6">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-primary/10 rounded-lg">
                                    <Bot className="h-6 w-6 text-primary" />
                                </div>
                                <h2 className="text-xl font-bold">Agent Detail View</h2>
                            </div>
                            <Button variant="ghost" size="sm" onClick={onClose}>
                                <X className="h-4 w-4" />
                            </Button>
                        </div>

                        <div className="space-y-6">
                            <Card>
                                <CardHeader>
                                    <CardTitle className="flex items-center gap-2">
                                        <Settings className="h-5 w-5 text-blue-600" />
                                        Basic Information
                                        <Badge variant="secondary" className="ml-auto">Editable</Badge>
                                    </CardTitle>
                                </CardHeader>
                                <CardContent className="space-y-4">
                                    <div className="flex items-start gap-4">
                                        <Avatar className="h-16 w-16 border-2 border-primary/20">
                                            <AvatarFallback className="bg-primary/10 text-primary text-lg font-semibold">
                                                <Bot className="h-8 w-8" />
                                            </AvatarFallback>
                                        </Avatar>
                                        
                                        <div className="flex-1 space-y-4">
                                            <div>
                                                <Label htmlFor="agent-name">Agent Name</Label>
                                                <Input id="agent-name" defaultValue={agentDetails.name} className="mt-1" />
                                            </div>
                                            
                                            <div>
                                                <Label htmlFor="agent-description">Agent Description</Label>
                                                <Textarea id="agent-description" defaultValue={agentDetails.description} rows={6} className="mt-1" />
                                            </div>
                                        </div>
                                    </div>
                                </CardContent>
                            </Card>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <Card>
                                    <CardHeader>
                                        <CardTitle className="flex items-center gap-2">
                                            <Zap className="h-5 w-5 text-purple-600" />
                                            Model Configuration
                                        </CardTitle>
                                    </CardHeader>
                                    <CardContent className="space-y-4">
                                        <div>
                                            <Label htmlFor="model-select">Model</Label>
                                            <Select defaultValue={agentDetails.model}>
                                                <SelectItem value="GPT-4o Mini">GPT-4o Mini</SelectItem>
                                                <SelectItem value="GPT-4o">GPT-4o</SelectItem>
                                                <SelectItem value="Claude-3 Sonnet">Claude-3 Sonnet</SelectItem>
                                            </Select>
                                        </div>

                                        <div>
                                            <Label htmlFor="agent-role">Agent Resource Role</Label>
                                            <Input id="agent-role" defaultValue={agentDetails.role} className="mt-1" />
                                        </div>
                                    </CardContent>
                                </Card>

                                <Card>
                                    <CardHeader>
                                        <CardTitle className="flex items-center gap-2">
                                            <Edit3 className="h-5 w-5 text-green-600" />
                                            Quick Actions
                                        </CardTitle>
                                    </CardHeader>
                                    <CardContent className="space-y-3">
                                        <Button variant="outline" className="w-full justify-start gap-2">
                                            <Bot className="h-4 w-4" />
                                            Test Agent
                                        </Button>
                                        <Button variant="outline" className="w-full justify-start gap-2">
                                            <Settings className="h-4 w-4" />
                                            Export Configuration
                                        </Button>
                                        <Button variant="outline" className="w-full justify-start gap-2">
                                            <Zap className="h-4 w-4" />
                                            Duplicate Agent
                                        </Button>
                                    </CardContent>
                                </Card>
                            </div>

                            <Card>
                                <CardHeader>
                                    <CardTitle className="flex items-center gap-2">
                                        <Edit3 className="h-5 w-5 text-orange-600" />
                                        Agent Instructions
                                    </CardTitle>
                                </CardHeader>
                                <CardContent>
                                    <Label htmlFor="agent-instructions">Detailed Instructions</Label>
                                    <Textarea 
                                        id="agent-instructions"
                                        defaultValue={agentDetails.instructions}
                                        rows={8}
                                        className="mt-1 font-mono text-sm"
                                    />
                                </CardContent>
                            </Card>

                            <Card>
                                <CardHeader>
                                    <CardTitle className="flex items-center gap-2">
                                        <Settings className="h-5 w-5 text-red-600" />
                                        Activation Conditions
                                    </CardTitle>
                                </CardHeader>
                                <CardContent>
                                    <Label htmlFor="agent-conditions">Conditions & Business Rules</Label>
                                    <Textarea 
                                        id="agent-conditions"
                                        defaultValue={agentDetails.conditions}
                                        rows={6}
                                        className="mt-1 font-mono text-sm"
                                    />
                                </CardContent>
                            </Card>

                            <div className="flex justify-end gap-3 pt-4 border-t">
                                <Button variant="outline" onClick={onClose}>
                                    Cancel
                                </Button>
                                <Button className="gap-2">
                                    <Save className="h-4 w-4" />
                                    Save Changes
                                </Button>
                            </div>
                        </div>
                    </div>
                </Modal>
            );
        };

        // Main Dashboard Component
        const AgentDashboard = () => {
            const [showAnalytics, setShowAnalytics] = useState(false);
            const [showDetailModal, setShowDetailModal] = useState(false);
            const [expandedSections, setExpandedSections] = useState({
                info: true,
                signals: true,
                startingPoints: true
            });

            const toggleSection = (section) => {
                setExpandedSections(prev => ({
                    ...prev,
                    [section]: !prev[section]
                }));
            };

            const handleSaveChanges = () => {
                alert('Changes saved successfully!');
            };

            const handleCancel = () => {
                if (confirm('Are you sure you want to cancel? All unsaved changes will be lost.')) {
                    // Reset form or navigate away
                    console.log('Cancelled');

            if (showAnalytics) {
                return React.createElement(AgentAnalytics, { onBack: () => setShowAnalytics(false) });

            return (
                <div className="min-h-screen bg-gradient-to-br from-background to-professional/20">
                    <div className="border-b bg-card/80 backdrop-blur-sm sticky top-0 z-40">

                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="p-2 bg-primary/10 rounded-lg">

                                    <Button variant="outline" onClick={handleCancel}>

                                    <Button onClick={handleSaveChanges} className="bg-primary hover:bg-primary/90">

                    </div>

                                <div className="flex items-center gap-3">
                                    <Badge variant="secondary" className="bg-primary/10 text-primary border-primary/20">
                                        01
                                    </Badge>
                                    <CardTitle className="text-xl">Agent Information</CardTitle>
                                </div>
                                <Button
                                    variant="ghost"
                                    size="sm"
                                    onClick={() => toggleSection('info')}
                                    className="h-8 w-8 p-0"
                                >
                                    {expandedSections.info ? (
                                        <ChevronUp className="h-4 w-4" />
                                    ) : (
                                        <ChevronDown className="h-4 w-4" />
                                    )}
                                </Button>
                            </CardHeader>
                            {expandedSections.info && (
                                <CardContent>
                                    <AgentInfo onDetailView={() => setShowDetailModal(true)} />
                                </CardContent>
                            )}
                        </Card>

                        <Card className="shadow-elegant border-0 bg-card/80 backdrop-blur-sm">
                            <CardHeader className="flex flex-row items-center justify-between space-y-0 pb-4">
                                <div className="flex items-center gap-3">
                                    <Badge variant="secondary" className="bg-primary/10 text-primary border-primary/20">
                                        02
                                    </Badge>
                                    <CardTitle className="text-xl">Agent Signals</CardTitle>
                                </div>
                                <Button
                                    variant="ghost"
                                    size="sm"
                                    onClick={() => toggleSection('signals')}
                                    className="h-8 w-8 p-0"
                                >
                                    {expandedSections.signals ? (
                                        <ChevronUp className="h-4 w-4" />
                                    ) : (
                                        <ChevronDown className="h-4 w-4" />
                                    )}
                                </Button>
                            </CardHeader>
                            {expandedSections.signals && (
                                <CardContent>
                                    <AgentSignals />
                                </CardContent>
                            )}
                        </Card>

                        <Card className="shadow-elegant border-0 bg-card/80 backdrop-blur-sm">
                            <CardHeader className="flex flex-row items-center justify-between space-y-0 pb-4">
                                <div className="flex items-center gap-3">
                                    <Badge variant="secondary" className="bg-primary/10 text-primary border-primary/20">
                                        03
                                    </Badge>
                                    <CardTitle className="text-xl">Agent Starting Points</CardTitle>
                                </div>
                                <Button
                                    variant="ghost"
                                    size="sm"
                                    onClick={() => toggleSection('startingPoints')}
                                    className="h-8 w-8 p-0"
                                >
                                    {expandedSections.startingPoints ? (
                                        <ChevronUp className="h-4 w-4" />
                                    ) : (
                                        <ChevronDown className="h-4 w-4" />
                                    )}
                                </Button>
                            </CardHeader>
                            {expandedSections.startingPoints && (
                                <CardContent>
                                    <AgentStartingPoints />
                                </CardContent>
                            )}
                        </Card>
                    </div>

                    <AgentDetailModal 
                        isOpen={showDetailModal} 
                        onClose={() => setShowDetailModal(false)}
                    />
                </div>
            );
        };

        // Render the app
        ReactDOM.render(React.createElement(AgentDashboard), document.getElementById('root'));
    </script>
</body>
</html>
